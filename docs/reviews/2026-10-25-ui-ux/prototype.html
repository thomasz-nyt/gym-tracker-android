vious{padding:12px 0;font-size:14px;line-height:1.5}.previous summary{min-height:36px;cursor:pointer}.movement{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-weight:700}.movement .no{font-size:13px;width:23px;color:var(--muted)}.movement small{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:4px}.movement .counts{font-size:12px;color:var(--muted);white-space:nowrap}.movement.selected{border-left:3px solid var(--accent);padding-left:10px;background:var(--shade)}.load{padding:22px 0;border-bottom:1px solid var(--line)}.load label{display:block;margin-bottom:9px;font-size:12px}.progress-track{height:3px;background:var(--line);margin:14px 0}.progress-track span{display:block;height:3px;background:var(--ink);width:66%}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{flex:1;font-size:14px;font-weight:700}.tabs .selected{border-bottom:2px solid var(--accent)}.note{font-size:13px;line-height:1.45;background:var(--shade);padding:12px;margin:14px 0}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px 0}.stat-grid b{font-size:28px;display:block;letter-spacing:-.04em}.stat-grid small{font-size:11px;color:var(--muted)}.field{margin:20px 0}.field label{display:block;font-size:14px;margin-bottom:9px;font-weight:650}.stepper{display:flex;border:1px solid var(--line);align-items:center}.stepper button{width:56px;height:56px;background:var(--shade);font-size:24px}.stepper input{width:0;min-width:0;flex:1;border:0;background:none;color:var(--ink);font-size:28px;text-align:center;font-weight:800;height:56px}.chiprow{display:flex;gap:8px;flex-wrap:wrap}.chiprow button{border:1px solid var(--line);padding:0 12px;font-size:13px}.chiprow .on{border-color:var(--ink);background:var(--shade)}.chart{height:130px;display:flex;align-items:flex-end;gap:22px;border-bottom:1px solid var(--line);padding:10px 15px}.chart div{background:var(--ink);flex:1;position:relative}.chart small{position:absolute;top:-20px;left:0;font-size:11px}.chart-labels{display:flex;justify-content:space-around;font-size:10px;color:var(--muted);padding:10px 0}.reviewer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;background:#201e1d;color:#fff;box-shadow:0 4px 20px #0004;border-radius:32px;display:flex;align-items:center;padding:4px 14px;gap:12px;font-size:12px;white-space:nowrap}.reviewer button{color:#fff;min-width:40px;min-height:40px}.reviewer a{padding:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.toolbar a{border:1px solid #bdb8b0;padding:12px 16px;font-size:13px;text-decoration:none}.caption{font-size:13px;line-height:1.5;margin-top:14px;max-width:370px}.single{margin:0;background:#f3f2f2}.single .phone{box-shadow:none;width:100vw;height:100dvh;max-width:none}.single .reviewer{display:none}.gallery{display:grid;grid-template-columns:repeat(3,390px);gap:32px 28px;margin-top:30px}.gallery h3{margin-bottom:12px}.gallery .caption{min-height:42px}.toast{position:absolute;bottom:108px;left:16px;right:16px;background:var(--ink);color:var(--bg);padding:14px;font-size:13px;z-index:9}.scene-note{font-size:11px;color:var(--muted);padding-top:10px;text-align:center}.home-hero{padding:18px 0 20px}.home-hero h1{font-size:38px;margin-bottom:16px}.home-hero .line{height:3px;width:38px;background:var(--accent);margin-bottom:22px}.completed{padding:18px 0;border-top:1px solid var(--line)}.completed b{display:block;font-size:17px}.completed small{display:block;margin-top:5px;color:var(--muted);line-height:1.5}.screen-list button{min-height:48px}.focus-controls{display:flex;gap:10px}.focus-controls button{flex:1}.plan-card{padding:16px 0;border-bottom:1px solid var(--line)}.plan-card.current{border-left:3px solid var(--accent);padding:16px 12px;background:var(--shade)}.callout{font-size:12px;line-height:1.5;margin-top:12px;padding-top:12px;border-top:1px solid #bdb8b0}.capture .reviewer{display:none}@media(max-width:1100px){.layouts{display:flex;overflow:auto}.gallery{grid-template-columns:repeat(2,390px)}.page{padding:32px 20px 100px}}@media(max-width:650px){.page h1{font-size:34px}.gallery{grid-template-columns:390px}.page{padding:24px 12px 90px}.phone{width:min(390px,calc(100vw - 24px))}.layouts{display:block}.layouts>section{margin-bottom:30px}.panel-title{min-height:0}}
</style>
<body><main id="app"></main><script>
const qs=new URLSearchParams(location.search);let variant=qs.get('variant')||'A',screen=qs.get('screen')||'workout';
const names={A:'Workout sheet',B:'Focus + plan drawer',C:'Whole-plan checklist'};
const movementsData={'Machine Bench Press':{weight:50,reps:10,sets:[{weight:50,reps:12},{weight:50,reps:10}],target:'3 sets × 12 reps · 50 kg · Rest 1:30'},'Seated Cable Rows':{weight:40,reps:12,sets:[],target:'3 sets × 12 reps · 40 kg · Rest 1:30'},'Leg Press':{weight:100,reps:12,sets:[],target:'3 sets × 12 reps · 100 kg · Rest 1:30'}};
const state={logged:2,weight:50,reps:10,movement:'Machine Bench Press',rest:true,restMovement:'Machine Bench Press'};
function selected(){return movementsData[state.movement]}
function position(){return Object.keys(movementsData).indexOf(state.movement)+1}
const status=()=>'<div class="status"><span>9:41</span><span>▰  ▰  ▰</span></div>';
const header=(title='Upper A',meta='WORKOUT · 24:18')=>`<div class="appbar"><div class="grow"><div class="kicker muted">${meta}</div><h3 style="margin-top:5px">${title}</h3></div><button class="icon" aria-label="Settings" onclick="go('settings')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 3 3-1 1-3 3-1 1-3-3-2 1-3-3-2-3 1-2-1Z"/></svg></button><button class="quiet" onclick="go('finish')">Finish</button></div>`;
const rest=()=>state.rest?`<div class="rest"><div class="grow"><div class="kicker muted">Rest · ${state.restMovement}</div><b>1:12</b> <span class="small muted">of 1:30</span></div><button onclick="this.previousElementSibling.querySelector('b').textContent='1:42'">+30s</button><button onclick="state.rest=false;render()">Skip</button></div>`:'';
const target=()=>`<div class="target"><span class="kicker muted">Plan</span><br><b>${selected().target}</b></div>`;
const setrows=()=>`<div class="sets"><div class="setrow header"><span>SET</span><span>LOAD</span><span>ACTUAL REPS</span><span></span></div>${selected().sets.map((record,i)=>`<button class="setrow" style="width:100%;text-align:left" aria-label="Edit set ${i+1}" onclick="go('entry')"><span class="muted">${i+1}</span><span>${record.weight===null?'Bodyweight':record.weight+' kg'}</span><span>${record.reps}</span><span class="edit muted">↗</span></button>`).join('')}</div>`;
const previous=()=>`<details class="previous"><summary><b>Last time</b> · ${selected().weight} kg · 12 / 10 / 10 reps</summary><div class="small muted">18 Oct 2026 · 3 sets · ${selected().weight} kg each<br>Actual records from this exercise only.</div></details>`;
const movements=(full=false)=>`<div class="kicker muted" style="margin:18px 0 4px">${full?'Today’s plan':'Other movements · tap to switch'}</div>${Object.entries(movementsData).filter(([name])=>name!==state.movement).map(([name,m])=>`<button class="movement" onclick="selectMovement('${name}')"><span class="no">0${Object.keys(movementsData).indexOf(name)+1}</span><span class="grow">${name}<small>Plan 3 × 12 · ${m.weight} kg</small></span><span class="counts">${m.sets.length} / 3 sets ›</span></button>`).join('')}`;
const bottom=()=>`<div class="bottom"><button class="primary" onclick="logSet()"><span>${state.logged>=3?'Next movement →':`Log set ${state.logged+1}`}<small>${state.logged>=3?`${state.movement} · Plan set count met`:`${state.weight===null?'Bodyweight':state.weight+' kg ('+(state.weight*2.20462262).toFixed(1)+' lb)'} × ${state.reps} reps`}</small></span><span style="font-size:24px">${state.logged>=3?'→':'+'}</span></button><div class="row between"><button class="quiet" onclick="go('entry')">Adjust load / reps</button><button class="quiet" onclick="toast('Prototype: choose Skip or End early without creating sets.')">Skip / End early</button></div></div>`;
function workoutA(){return header()+`<div class="content">${rest()}<div class="row between"><div class="kicker muted">Movement ${position()} of 3</div><span class="tag">${state.logged} of 3 sets</span></div><h2 style="margin-top:9px">${state.movement}</h2>${target()}${setrows()}${previous()}${movements()}</div>`+bottom()}
function workoutB(){return header()+`<div class="content">${rest()}<div class="kicker muted">Movement ${position()} of 3 · ${state.logged} of 3 sets recorded</div><h1 style="margin-top:14px">${state.movement}</h1><div class="load"><div class="kicker muted">Next actual set · tap Adjust to change</div><div class="large-number" style="margin-top:12px">${state.weight} <span style="font-size:22px">kg</span> × ${state.reps}</div><div class="small muted" style="margin-top:8px">${state.weight===null?'Bodyweight':(state.weight*2.20462262).toFixed(1)+' lb'} · Target: 12 reps</div></div>${setrows()}${previous()}<button class="outline" onclick="document.getElementById('drawer').hidden=!document.getElementById('drawer').hidden">Today’s plan · 3 movements ↓</button><div id="drawer" hidden>${movements(true)}</div></div>`+bottom()}
function workoutC(){return header()+`<div class="content">${rest()}<div class="row between"><h2>Today’s plan</h2><span class="small muted">${Object.values(movementsData).filter(m=>m.sets.length>=3).length} / 3 met</span></div><p class="small muted">Tap a movement to log or correct its sets.</p><div class="plan-card current"><div class="row between"><div class="kicker accent">Selected · 0${position()}</div><span class="tag">${state.logged} of 3 sets</span></div><h3 style="margin-top:10px">${state.movement}</h3><div class="small muted" style="margin-top:7px">Plan ${selected().target}</div>${setrows()}<button class="quiet" onclick="go('entry')">Correct a set ↗</button></div>${movements(true)}<div class="note">Selection changes the open movement.<br>Your rest countdown keeps running.</div></div>`+bottom()}
const nav=(selected='Train')=>`<div class="nav">${['Train','Exercises','Progress'].map(n=>`<button class="${n===selected?'selected':''}" onclick="go('${n==='Train'?'home':n==='Exercises'?'catalog':'progress'}')">${n}</button>`).join('')}</div>`;
function home(){return status()+`<div class="appbar"><span class="wordmark grow">REP<span class="accent">.</span></span><button class="quiet" onclick="toast('Prototype: routines')">Routines</button><button class="icon" aria-label="Settings" onclick="go('settings')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 3 3-1 1-3 3-1 1-3-3-2 1-3-3-2-3 1-2-1Z"/></svg></button></div><div class="content"><div class="home-hero"><div class="line"></div><div class="kicker muted">Your next workout</div><h1 style="margin-top:12px">Ready when<br>you are.</h1><p class="muted">Choose your plan, or train freestyle.</p></div><div class="rule"></div><div class="row between" style="padding:22px 0"><div><div class="kicker muted">Ready to train</div><h2 style="margin-top:8px">Upper A</h2><p class="small muted" style="margin:8px 0 0">3 movements · plan ready</p></div><span style="font-size:30px">↗</span></div><div class="small">Machine Bench Press<br>Seated Cable Rows<br>Leg Press</div><div class="space"></div><button class="outline" onclick="toast('Prototype: name → inspect/add exercises → optional targets')">Create a routine +</button><button class="quiet" onclick="toast('Prototype: choose a backup and preview it before replacement')">Restore a backup ↗</button></div><div class="bottom"><button class="primary" onclick="go('workout')">Start Upper A <span>→</span></button><button class="quiet" style="width:100%" onclick="go('workout')">Or train freestyle</button></div>`+nav()}
function entry(){return status()+`<div class="appbar"><button class="quiet" onclick="go('workout')">← Cancel</button><span class="grow"></span><span class="kicker muted">One actual set</span></div><div class="content"><h1>Log set ${state.logged+1}</h1><p class="muted">${state.movement}</p><div class="note"><b>Last recorded:</b> ${selected().weight} kg × 10 reps<br><span class="small">Plan: ${selected().target}</span></div><div class="field"><label for="weight">Load · kg <span class="muted">(${state.weight===null?'bodyweight':(state.weight*2.20462262).toFixed(1)+' lb'})</span></label><div class="stepper"><button aria-label="Decrease load" onclick="step('weight',-2.5)">−</button><input id="weight" inputmode="decimal" value="${state.weight}" aria-label="Load in kilograms"><button aria-label="Increase load" onclick="step('weight',2.5)">+</button></div><span class="small muted">Leave empty for bodyweight.</span></div><div class="field"><label for="reps">Reps actually performed</label><div class="stepper"><button aria-label="Decrease reps" onclick="step('reps',-1)">−</button><input id="reps" inputmode="numeric" value="${state.reps}" aria-label="Reps actually performed"><button aria-label="Increase reps" onclick="step('reps',1)">+</button></div></div><div class="field"><label>Effort · optional <button class="quiet" onclick="toast('RPE is your perceived effort for this set. Optional; skip if unsure.')">What is RPE?</button></label><div class="chiprow">${['Skip','6','7','8','9','10'].map(x=>`<button onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div></div><div class="rule"></div><button class="quiet" onclick="toast('Prototype: explicitly choose a count before saving identical sets.')">Log several identical sets…</button></div><div class="bottom"><button class="primary" onclick="saveEntry()">Save 1 set <span>✓</span></button><div id="validation" class="small accent" role="alert"></div></div>`}
function progress(){return status()+`<div class="appbar"><span class="wordmark grow">REP<span class="accent">.</span></span><button class="quiet" onclick="toast('Prototype: workout history')">Past workouts ↗</button></div><div class="content"><div class="kicker muted">Your training, as recorded</div><h1 style="margin:10px 0 24px">Progress</h1><button class="outline" onclick="toast('Prototype: select any trained exercise, including bodyweight movements.')">Machine Bench Press <span style="float:right">⌄</span></button><div class="space"></div><div class="kicker muted">Latest · 25 Oct 2026</div><div class="stat-grid"><div><b>50<small> kg</small></b><small>Load (110.2 lb)</small></div><div><b>3</b><small>Actual sets</small></div><div><b>12/10/8</b><small>Actual reps</small></div></div><div class="rule"></div><div class="row between" style="margin-top:18px"><b>Recent load</b><span class="small muted">kg</span></div><div class="chart">${[60,60,75,75].map((h,i)=>`<div style="height:${h}%"><small>${i<2?'40':'50'}</small></div>`).join('')}</div><div class="chart-labels"><span>04 Oct</span><span>11 Oct</span><span>18 Oct</span><span>25 Oct</span></div><button class="movement" onclick="toast('Prototype: opens actual sets from this workout.')"><span class="grow">25 Oct 2026 · 10:42<small>50 kg · 12 / 10 / 8 reps · 3 sets</small></span><span>↗</span></button><button class="movement" onclick="toast('Prototype: opens actual sets from this workout.')"><span class="grow">18 Oct 2026 · 09:30<small>50 kg · 12 / 10 / 10 reps · 3 sets</small></span><span>↗</span></button><details class="previous"><summary>Estimates & personal records</summary><p class="small muted">Secondary information. Estimated strength is labelled separately from logged performance.</p></details><p class="small muted">Current week: 19–25 Oct · partial through now<br>Weeks begin Monday.</p></div>`+nav('Progress')}
function finish(){return status()+`<div class="appbar"><span class="wordmark">REP<span class="accent">.</span></span></div><div class="content"><div class="kicker muted">Workout safely saved</div><h1 style="margin-top:12px">Workout saved.</h1><div class="stat-grid"><div><b>42<small> min</small></b><small>Total visit</small></div><div><b>5</b><small>Actual sets</small></div><div><b>3</b><small>Movements</small></div></div><div class="completed"><b>Machine Bench Press <span class="tag">Plan met</span></b><small>3 of 3 sets · 50 kg · 12 / 10 / 8 reps</small></div><div class="completed"><b>Seated Cable Rows <span class="tag">Ended early</span></b><small>2 of 3 sets · 40 kg · 12 / 10 reps</small></div><div class="completed"><b>Seated Leg Curl <span class="tag">Skipped</span></b><small>0 sets recorded</small></div><div class="note"><b>Today’s exercise list changed</b><p class="small" style="margin:8px 0">Added: Seated Leg Curl · Removed: Leg Press<br>Keep these changes for future workouts?</p><button class="outline" onclick="go('routine')">Review routine changes →</button><button class="quiet" onclick="toast('Workout saved. Original routine unchanged.')">Today only</button></div><p class="small muted">Review offers Update original / Save as new / Today only. Actual reps and load never silently become targets.</p></div><div class="bottom"><button class="primary" onclick="go('home')">Done <span>✓</span></button><button class="quiet" onclick="toast('Prototype: latest workout only, within 10 minutes, with no newer workout.')">Undo finish · available for 10 minutes</button></div>`}
function routine(){return status()+`<div class="appbar"><button class="quiet" onclick="go('finish')">← Summary</button></div><div class="content"><div class="kicker muted">Workout already saved</div><h1 style="margin-top:12px">Keep today’s<br>list changes?</h1><p class="muted" style="margin-top:16px">Review Upper A before saving it for future workouts.</p><div class="completed"><b>+ Seated Leg Curl</b><small>Added to today’s workout · No targets set yet</small></div><div class="completed"><b>− Leg Press</b><small>Removed from today’s exercise list</small></div><div class="completed"><b>Unchanged</b><small>Machine Bench Press and Seated Cable Rows keep their planned targets.</small></div><div class="note">Only the exercise list changes. Keep recorded results separate from future targets.</div><p class="small muted">A missing or independently changed original cannot be silently overwritten. Cancel or failure keeps the saved workout and original routine.</p></div><div class="bottom"><button class="primary" onclick="toast('Prototype only: original routine would update after conflict checks.')">Update original →</button><div style="height:10px"></div><button class="outline" onclick="toast('Prototype only: enter a name, review and save a new routine.')">Save as new…</button><button class="quiet" style="width:100%" onclick="go('finish')">Today only · leave original unchanged</button></div>`}
function settings(){return status()+`<div class="appbar"><button class="quiet" onclick="go('workout')">← Back to workout</button></div><div class="content"><h1>Settings</h1><p class="muted">Your workout and countdown keep running.</p><div class="rest"><span class="grow">Rest · Bench press</span><b>1:12</b></div><h3>Training</h3><div class="movement">Units <span class="grow"></span>kg / lb</div><div class="movement">Default rest <span class="grow"></span>1:30</div><div class="movement">Keep screen on <span class="grow"></span>On</div><div class="space"></div><h3>Optional connections</h3><div class="movement"><span class="grow">Health access<small>Unavailable / not connected</small></span><button class="quiet" onclick="toast('Prototype: opens system permissions.')">Manage ↗</button></div><div class="movement"><span class="grow">Heart-rate band<small>No band connected</small></span><button class="quiet" onclick="toast('Prototype: Search again / Change / Forget.')">Manage ↗</button></div><div class="space"></div><h3>Your data</h3><button class="movement" onclick="toast('Prototype: export all recorded data.')">Export backup ↗</button><p class="small muted">Restore is unavailable during a workout. Finish or discard the workout first. A complete validated safety copy is required before replacement.</p></div>`}
function catalog(){return status()+`<div class="appbar"><button class="quiet" onclick="go('workout')">← Workout</button><h3 class="grow">Add exercises</h3></div><div class="content"><label for="search" class="kicker muted">Find a movement</label><input id="search" placeholder="Search exercises" style="width:100%;height:56px;border:1px solid var(--line);background:none;margin:12px 0;padding:12px;color:var(--ink)"><div class="chiprow"><button class="on">All equipment</button><button>Muscle group ⌄</button></div><p class="small muted" style="margin-top:18px">Inspect a movement before adding it.</p>${['Machine Bench Press','Seated Cable Rows','Leg Press','Seated Leg Curl'].map((x,i)=>`<div class="movement"><span class="grow">${x}<small>${i===1?'Cable':'Machine'} · <a href="#" onclick="event.preventDefault();toast('Prototype: inspect instructions, equipment and muscle groups.')">View exercise ↗</a></small></span><button class="icon" aria-label="Add ${x}" onclick="this.textContent='✓';toast('${x} added to today’s workout.')">+</button></div>`).join('')}</div><div class="bottom"><button class="primary" onclick="go('workout')">Done · back to workout <span>→</span></button></div>`}
function phone(v=variant,s=screen,dark=false){let content=s==='workout'?status()+({A:workoutA,B:workoutB,C:workoutC}[v]||workoutA)():({home,entry,progress,finish,settings,catalog,routine}[s]||home)();return `<div class="phone ${dark?'dark':''}" data-variant="${v}" data-screen="${s}">${content}</div>`}
function switcher(){return `<div class="reviewer"><button aria-label="Previous variant" onclick="cycle(-1)">←</button><span>${variant} · ${names[variant]}</span><button aria-label="Next variant" onclick="cycle(1)">→</button><a href="?view=compare">Compare</a><a href="?view=flow">Flow</a></div>`}
function render(){const app=document.getElementById('app');document.body.className=qs.has('capture')?'capture':'';if(qs.get('view')==='single'){document.body.classList.add('single');app.innerHTML=phone(variant,screen,qs.get('theme')==='dark');return}if(qs.get('view')==='compare'){app.innerHTML=`<div class="page"><div class="review-label">REP / discussion prototype / synthetic example data</div><h1>Keep the plan in view.<br>Keep the next log within reach.</h1><p class="intro">Three layout options for the same moment: two actual sets recorded, rest running, one set remaining. These are proposals rendered in HTML, not screenshots of the Android app.</p><div class="layouts">${['A','B','C'].map(v=>`<section><div class="panel-title"><div class="kicker accent">${v} ${v==='A'?'· Recommended starting point':''}</div><h3 style="margin-top:8px">${names[v]}</h3><p>${{A:'Current movement, actual sets and plan together; a persistent log action.',B:'One movement fills the screen; open the plan only when you need it.',C:'The entire workout is the main view; expand the selected movement.'}[v]}</p></div>${phone(v,'workout',v==='B')}<div class="callout">${{A:'Best balance for beginners. The timer accompanies the plan and correction tools.',B:'Least distraction, but hides the rest of the workout behind another action.',C:'Easiest overview and switching; more scanning and scrolling as the plan grows.'}[v]}</div></section>`).join('')}</div></div>`+switcher();return}if(qs.get('view')==='flow'){const scenes=[['home','01 / Start with a plan'],['workout','02 / Log without losing the plan'],['entry','03 / One action, one actual set'],['catalog','04 / Inspect before adding'],['progress','05 / Actual performance first'],['finish','06 / Honest finish + explicit reuse']];app.innerHTML=`<div class="page"><div class="review-label">REP / proposed flow / synthetic example data</div><h1>A clearer workout, from preparation to review.</h1><p class="intro">Recommended direction A. Screens illustrate separate moments, using illustrative records rather than a single live workout. Preserve offline use, optional integrations, fast logging and the existing visual identity.</p><div class="gallery">${scenes.map(([s,title])=>`<section><h3>${title}</h3>${phone('A',s)}</section>`).join('')}</div></div>`+switcher();return}app.innerHTML=`<div class="page"><div class="review-label">Throwaway prototype · no real records</div><h1>${names[variant]}</h1><p class="intro">Use the controls to explore. Switch layouts with the bottom arrows or keyboard ← / →. All data lives in memory.</p><div class="toolbar">${['home','workout','entry','catalog','progress','finish','settings'].map(s=>`<a href="?variant=${variant}&screen=${s}">${s}</a>`).join('')}<a href="?view=compare">Compare layouts</a><a href="?view=flow">Proposed flow</a></div>${phone()}<pre class="small" style="max-width:390px;white-space:pre-wrap">Prototype state: ${JSON.stringify({variant,screen,movement:state.movement,actualSets:selected().sets,restRunning:state.rest},null,2)}</pre></div>`+switcher()}
function cycle(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];qs.set('variant',variant);history.replaceState({},'',`?${qs}`);render()}
function go(s){screen=s;qs.set('screen',s);if(['compare','flow'].includes(qs.get('view')))qs.delete('view');history.replaceState({},'',`?${qs}`);render()}
function toast(text){document.querySelectorAll('.toast').forEach(t=>t.remove());const p=document.querySelector('.phone');if(!p)return;p.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${text}</div>`);setTimeout(()=>p.querySelector('.toast')?.remove(),3500)}
function logSet(){if(state.logged>=3){selectMovement('Seated Cable Rows');return}selected().sets.push({weight:state.weight,reps:state.reps});state.logged=selected().sets.length;state.rest=true;state.restMovement=state.movement;render();toast('1 actual set recorded')}
function selectMovement(name){state.movement=name;state.logged=selected().sets.length;state.weight=selected().weight;state.reps=selected().reps;render();toast('Selection changed. Rest continues.')}
function step(id,n){const el=document.getElementById(id),value=Number(el.value||0);el.value=Math.max(id==='reps'?1:0,value+n)}
function saveEntry(){const w=document.getElementById('weight').value.trim(),r=Number(document.getElementById('reps').value);if((w!==''&&(!Number.isFinite(Number(w))||Number(w)<0))||!Number.isInteger(r)||r<1){document.getElementById('validation').textContent='Enter a valid nonnegative load and a whole number of reps (at least 1).';return}state.weight=w===''?null:Number(w);state.reps=r;selected().sets.push({weight:state.weight,reps:state.reps});state.logged=selected().sets.length;state.rest=true;state.restMovement=state.movement;go('workout');toast('1 actual set recorded')}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
