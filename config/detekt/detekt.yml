# Deltas from detekt's default config (buildUponDefaultConfig = true).
# Every suppression needs a reason — see CLAUDE.md "Definition of done".

build:
  maxIssues: 0

# Note: detekt's `formatting` ruleset (the detekt-formatting artifact) is deliberately
# not on the classpath. ktlint runs as its own Gradle plugin and is the authority on
# formatting; running both would produce duplicate findings for every style issue.

complexity:
  LongParameterList:
    # Composables legitimately take many parameters; state hoisting is the point. A
    # @HiltViewModel constructor is written by the DI graph, never by hand, so the usual
    # "too many arguments to call comfortably" argument does not apply either. Cohesion is
    # still worth watching: ActiveSessionViewModel currently drives two screens and should
    # split when the search screen grows.
    ignoreAnnotated: ['Composable', 'HiltViewModel']
    # Test data builders take one defaulted parameter per field on purpose, so a test can
    # name only the field it cares about. The rule is about production APIs.
    excludes: ['**/test/**', '**/androidTest/**']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    # A Hilt @Module is a list of @Provides bindings. Its length tracks how many things the
    # graph holds, not how much responsibility one class has taken on.
    ignoreAnnotated: ['Module']

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    # A palette is nothing but numbers. `Color(0xFFF26200)` bound to a named private val is
    # already the "well named constant" this rule asks for — there is no further name to give
    # the literal inside it. The values are gated by GymColorSchemeTest, which asserts contrast,
    # hue and brightness (ADR-0016); that is a stronger check than a naming convention.
    #
    # The test globs repeat detekt's own defaults: a rule's `excludes` replaces the default
    # list rather than adding to it, so omitting them here would start failing every test file
    # that types a number.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/*.Test.kt'
      - '**/*.Spec.kt'
      - '**/*.Spek.kt'
      - '**/designsystem/theme/Color.kt'
  UnusedPrivateMember:
    # @Preview composables are entry points for the IDE, never called from code. GymPreviews is
    # our multipreview wrapper around it (ADR-0016) — detekt matches the annotation written on
    # the function, not what that annotation is itself annotated with, so it needs naming too.
    ignoreAnnotated: ['Preview', 'GymPreviews']
