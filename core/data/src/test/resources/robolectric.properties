# Robolectric runs these tests against Android 35, not our targetSdk of 36, because
# Robolectric's Android 36 image requires JDK 21 and this project's toolchain is JDK 17
# (build-logic Conventions.kt). Its 37 image does not exist at all yet, and compileSdk is 37.
#
# This is a toolchain constraint, not a product decision. It costs nothing here: these are
# Room and SQLite tests, whose behaviour does not differ between API 35 and 36, and minSdk
# is 26 regardless. Raise this to 36 when the project moves to JDK 21.
sdk=35
